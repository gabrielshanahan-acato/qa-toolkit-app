<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Testing Toolkit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/effects.css">
</head>

<body class="bg-gray-900 text-white min-h-screen">

    <!-- Header -->
    <header class="p-1 border-b border-gray-700 flex flex-col items-center">
        <div class="logo-wrapper">
            <img src="media/logo.png" alt="QA Toolkit Logo" class="h-48 md:h-64 object-contain hover:scale-105 transition-transform cursor-pointer">
        </div>
    </header>

    <!-- Main Content -->
    <main class="p-6 max-w-7xl mx-auto">

        <!-- Filter Bar -->
        <div id="filterBar" class="flex flex-wrap gap-2 mb-6"></div>

        <!-- Grid -->
        <div id="toolGrid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
        </div>

        <!-- Tool Container -->
        <div id="tool-container" class="hidden mt-10">
            
            <!-- Back Button -->
            <button onclick="goHome()" 
                class="mb-6 bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg">
                ← Back to Tools
            </button>

            <!-- Dynamic Tool Content -->
            <div id="tool-content" class="bg-gray-800 p-6 rounded-2xl shadow-lg">
                <!-- JS will inject tool UI here -->
            </div>

        </div>
    </main>

    <script src="js/script.js"></script>

</body>

</html>
